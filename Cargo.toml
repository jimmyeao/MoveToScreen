[package]
name = "jumpscreen"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_Console", "Win32_System_SystemServices", "Win32_Storage_FileSystem", "Win32_Graphics_Dwm", "Win32_UI_Shell_Common", "Win32_Storage_EnhancedStorage", "Win32_System_Threading", "Win32_System_ApplicationInstallationAndServicing", "Win32_Storage_Packaging_Appx", "Win32_System_Environment"] }

[build-dependencies]
embed-resource = "3.0.12"
